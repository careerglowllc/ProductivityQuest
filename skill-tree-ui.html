function drawOverview(){document.querySelectorAll("#overview .hub,#overview .hub-label,#overview .node-dot").forEach(e=>e.remove());let w=innerWidth,h=innerHeight,cx=w/2,cy=h*.5,r=Math.min(w,h)*.25,outer=Math.min(w,h)*.44,step=360/D.length,svg=$("#overviewLines"),paths="",hubs="",labels="";D.forEach((d,i)=>{let a=-90+i*step,[hx,hy]=polar(cx,cy,r,a),[lx,ly]=polar(cx,cy,outer,a);for(let j=0;j<6;j++){let aa=a-28+j*11,rad=r+(outer-r)*(.48+(j%3)*.14),p1=polar(hx,hy,(rad-r)*.32,aa+(j%2?7:-6)),p2=polar(hx,hy,(rad-r)*.66,aa-(j%2?7:-4)),end=polar(cx,cy,rad,aa);paths+=`<path class="line ${j<2?"active":"faint"}" d="M${hx} ${hy} L${p1[0]} ${p1[1]} L${p2[0]} ${p2[1]} L${end[0]} ${end[1]}"/>`;[p1,p2,end].forEach((p,k)=>{let n=document.createElement("button");n.className="node-dot "+(k===0?"progress":"locked");n.style.left=p[0]+"px";n.style.top=p[1]+"px";n.setAttribute("aria-label",d[0]+" branch");n.onclick=()=>enter(i);$("#overview").append(n)})}hubs+=`<button class="hub" data-i="${i}" style="left:${hx}px;top:${hy}px;--tone:${d[2]}" aria-label="Open ${d[0]}">${iconSvg(d[0])}</button>`;labels+=`<div class="hub-label" style="left:${lx}px;top:${ly}px"><b>${d[0]}</b><small>${d[1]}</small></div>`});svg.setAttribute("viewBox",`0 0 ${w} ${h}`);svg.innerHTML=paths;$("#overview").insertAdjacentHTML("beforeend",hubs+labels);document.querySelectorAll("#overview .hub").forEach(b=>b.onclick=()=>enter(+b.dataset.i))}
function depthMap(ns){let m=new Map(),walk=n=>{if(m.has(n[0]))return m.get(n[0]);let d=n[2].length?Math.max(...n[2].map(p=>walk(ns.find(x=>x[0]===p))))+1:0;m.set(n[0],d);return d};ns.forEach(walk);return m}
function drawFocus(){document.querySelectorAll(".focus-node").forEach(e=>e.remove());let ns=nodes(),dm=depthMap(ns),max=Math.max(...dm.values()),byDepth=[...Array(max+1)].map(()=>[]);ns.forEach(n=>byDepth[dm.get(n[0])].push(n));let pos=new Map(),w=innerWidth,h=innerHeight,svg=$("#focusLines"),paths="";byDepth.forEach((arr,d)=>arr.forEach((n,i)=>{let x=w*(.08+(i+1)*.84/(arr.length+1)),y=h*(.71-d*.105);pos.set(n[0],[x,y])}));ns.forEach(n=>{let [x,y]=pos.get(n[0]);n[2].forEach(p=>{let q=pos.get(p);if(q)paths+=`<path class="line ${state(n)==="locked"?"faint":"active"}" d="M${q[0]} ${q[1]} Q${(q[0]+x)/2} ${(q[1]+y)/2} ${x} ${y}"/>`});let b=document.createElement("button");b.className="focus-node "+state(n);b.style.left=x+"px";b.style.top=y+"px";b.setAttribute("aria-label",n[1]);b.onclick=()=>selectNode(n);$("#focus").append(b)});svg.setAttribute("viewBox",`0 0 ${w} ${h}`);svg.innerHTML=paths;$("#focusHub").style.setProperty("--tone",D[current][2]);$("#focusHub").innerHTML=iconSvg(D[current][0])}
function enter(i,instant=false){current=i;selected=null;if(instant){document.body.classList.add('deep-link')}$("#overview").classList.add("hidden");$("#focus").classList.add("active");$("#focusName").textContent=D[i][0];$("#focusDesc").textContent=D[i][1];drawFocus()}function selectNode(n){selected=n;let s=state(n);$("#veil").classList.add("on");$("#overlay").classList.add("show");$("#oState").textContent=s+" · "+n[0];$("#oName").textContent=n[1];let req=n[2].map(p=>nodes().find(x=>x[0]===p)?.[1]).filter(Boolean);$("#oDesc").textContent=req.length?"Prerequisites: "+req.join(" · "):"Foundation milestone · no prerequisites";$("#oProgress").textContent=s==="mastered"?"path illuminated · complete":s==="available"?"prerequisite met · ready":"prerequisite path still forming";let b=$("#unlock");b.hidden=s!=="available";b.disabled=progress.points<1;b.onclick=()=>{progress.lit[current+"-"+n[0]]=1;progress.points--;save();drawFocus();selectNode(n);toast("Node illuminated · path continues")}}function closeFocus(){$("#focus").classList.remove("active");$("#overview").classList.remove("hidden");$("#veil").classList.remove("on");$("#overlay").classList.remove("show");drawOverview()}function cycle(x){enter((current+x+D.length)%D.length)}function toast(t){let x=$("#toast");x.textContent=t;x.classList.add("show");setTimeout(()=>x.classList.remove("show"),1800)}
$("#focusBack").onclick=closeFocus;$("#overviewBtn").onclick=closeFocus;$("#focusPrev").onclick=()=>cycle(-1);$("#focusNext").onclick=()=>cycle(1);$("#overviewPrev").onclick=()=>cycle(-1);$("#overviewNext").onclick=()=>cycle(1);addEventListener("resize",()=>{drawOverview();if($("#focus").classList.contains("active"))drawFocus()});addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#focus").classList.contains("active"))closeFocus();if(e.key==="ArrowLeft")cycle(-1);if(e.key==="ArrowRight")cycle(1)});drawOverview();let q=new URLSearchParams(location.search).get("domain"),qi=D.findIndex(d=>d[0].toLowerCase().replaceAll(" ","-")===q);if(qi>=0)enter(qi,true);
