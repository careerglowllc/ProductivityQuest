@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap');:root{--sky:#565e84;--ink:#f7f5fb;--cyan:#66e3e1;--violet:#b596ee;--pink:#e68eb4;--yellow:#f0d879;--red:#d77f8c;--sans:"DM Sans",sans-serif;--mono:"Space Mono",monospace}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--sky);color:var(--ink);font-family:var(--sans)}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:2px solid #fff;outline-offset:3px}.scene{position:relative;width:100vw;height:100dvh;min-height:480px;overflow:hidden;background:radial-gradient(ellipse at 50% 48%,#687199 0,#565e84 65%,#505779 100%)}.scene:before{content:"";position:absolute;inset:0;opacity:.22;background-image:radial-gradient(circle,#fff 0 1px,transparent 1.4px),radial-gradient(circle,#d7ddff 0 1px,transparent 1.5px);background-size:139px 167px,271px 223px;animation:stars 32s linear infinite}.map,.focus{position:absolute;inset:0;transition:opacity .55s,transform .75s}.map.hidden{opacity:0;pointer-events:none;transform:scale(.8)}.focus{opacity:0;pointer-events:none;transform:scale(.75)}.focus.active{opacity:1;pointer-events:auto;transform:scale(1)}svg.lines,.focus-lines{position:absolute;inset:0;width:100%;height:100%;overflow:visible}.line{fill:none;stroke:#f2efffa8;stroke-width:1.05;stroke-linecap:round;animation:draw 2s ease both}.line.active{stroke:#fff;filter:drop-shadow(0 0 3px #fff)}.line.faint{opacity:.5}.center{position:absolute;left:50%;top:50%;width:142px;height:142px;transform:translate(-50%,-50%);z-index:2;pointer-events:none}.center:before,.center:after{content:"";position:absolute;inset:27px;border-radius:50%;background:radial-gradient(circle,#fff 0 1px,transparent 2px);background-size:12px 11px;animation:spin 8s linear infinite}.center:after{inset:12px;opacity:.5;transform:rotate(30deg);background-size:18px 15px;animation-direction:reverse}.center i{position:absolute;left:50%;top:50%;width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 20px 7px #fff,0 0 40px 10px #e8b5df;transform:translate(-50%,-50%)}.hub{position:absolute;transform:translate(-50%,-50%);width:48px;height:48px;border-radius:50%;border:1px solid var(--tone);background:#596187dd;color:var(--tone);display:grid;place-items:center;z-index:5;box-shadow:0 0 0 7px color-mix(in srgb,var(--tone),transparent 82%),0 0 24px color-mix(in srgb,var(--tone),transparent 35%)}.hub svg{width:17px}.hub-label{position:absolute;transform:translate(-50%,-50%);z-index:5;min-width:130px;text-align:center;pointer-events:none}.hub-label b{display:block;font-size:10px;font-weight:500;letter-spacing:.19em;text-transform:uppercase;white-space:nowrap}.hub-label small{display:block;color:#c9ccdcbd;font:8px var(--mono);letter-spacing:.04em;margin-top:4px;white-space:nowrap}.node-dot,.focus-node{position:absolute;width:7px;height:7px;border:0;padding:0;border-radius:50%;background:#fbfaff;box-shadow:0 0 9px 2px #fff;z-index:4;transform:translate(-50%,-50%)}.node-dot.locked,.focus-node.locked{background:transparent;border:1px solid #e1dfed;box-shadow:none}.node-dot.progress,.focus-node.progress{background:var(--violet)}.node-dot:hover,.focus-node:hover{transform:translate(-50%,-50%) scale(1.8)}.control{position:absolute;bottom:14px;border:0;background:transparent;color:#f3f0faaa;font:10px var(--mono);letter-spacing:.13em;text-transform:uppercase;z-index:8;padding:8px}.control:hover{color:#fff}.centered{left:50%;transform:translateX(-50%)}.left{left:10px;font-size:27px}.right{right:10px;font-size:27px}.focus-hub{position:absolute;left:50%;top:72%;width:74px;height:74px;transform:translate(-50%,-50%);border-radius:50%;border:1px solid var(--tone);background:#596187e8;color:var(--tone);display:grid;place-items:center;z-index:4;box-shadow:0 0 0 9px color-mix(in srgb,var(--tone),transparent 80%),0 0 32px color-mix(in srgb,var(--tone),transparent 35%)}.focus-hub svg{width:25px}.focus-label{pos </style></head><body><main class="scene"><section class="map" id="overview" aria-label="Ten skill constellation overview"><svg class="lines" id="overviewLines" aria-hidden="true"></svg><div class="center"><i></i></div><button class="control centered" id="overviewBtn">OVERVIEW · 10 SKILLS</button><button class="control left" id="overviewPrev" aria-label="Previous skill">‹</button><button class="control right" id="overviewNext" aria-label="Next skill">›</button></section><section class="focus" id="focus" aria-label="Focused production skill tree"><svg class="focus-lines" id="focusLines" aria-hidden="true"></svg><div class="focus-hub" id="focusHub"></div><div class="focus-label"><b id="focusName"></b><small id="focusDesc"></small></div><button class="control centered" id="focusBack">‹&nbsp; ALL SKILLS</button><button class="control left" id="focusPrev" aria-label="Previous skill">‹</button><button class="control right" id="focusNext" aria-label="Next skill">›</button><div class="veil" id="veil"></div><aside class="overlay" id="overlay" aria-live="polite"><div class="state" id="oState"></div><h2 id="oName"></h2><p id="oDesc"></p><div class="progress" id="oProgress"></div><button id="unlock">LIGHT THIS NODE · 1 POINT</button></aside></section><div class="toast" id="toast" role="status"></div></main><script src="skill-tree-data.js"></script><script>
const KEY="life-os-constellation-demo-v5",D=[["Mindset","transmute / reframe","#66e3e1"],["Scholar","study / synthesis","#b596ee"],["Charisma","presence / influence","#e68eb4"],["Physical","strength / performance","#f0d879"],["Artist","ideas / expression","#d77f8c"],["Connector","trust / belonging","#66e3e1"],["Craftsman","tools / creation","#b596ee"],["Explorer","discovery / courage","#e68eb4"],["Merchant","value / leverage","#f0d879"],["Health","vitality / longevity","#d77f8c"]],trees=window.PRODUCTION_SKILL_TREES,progress=JSON.parse(localStorage.getItem(KEY)||"null")||{points:1,lit:{}},current=0,selected=null,$=s=>document.querySelector(s);D.forEach(d=>{if(!trees[d[0]])throw Error("Missing production tree: "+d[0])});D.forEach(d=>{let k=D.indexOf(d)+"-"+trees[d[0]][0][0];if(!(k in progress.lit))progress.lit[k]=1});localStorage.setItem(KEY,JSON.stringify(progress));const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function save(){localStorage.setItem(KEY,JSON.stringify(progress))}function nodes(){return trees[D[current][0]]}function state(n){let k=current+"-"+n[0];if(progress.lit[k])return"mastered";if(n[2].length&&n[2].every(p=>progress.lit[current+"-"+p]))return"available";return n[2].length?"locked":"in-progress"}function polar(cx,cy,r,a){let q=a*Math.PI/180;return[cx+Math.cos(q)*r,cy+Math.sin(q)*r]}
function drawOverview(){document.querySelectorAll("#overview .hub,#overview .hub-label,#overview .node-dot").forEach(e=>e.remove());let w=innerWidth,h=innerHeight,cx=w/2,cy=h*.5,r=Math.min(w,h)*.25,outer=Math.min(w,h)*.44,step=360/D.length,svg=$("#overviewLines"),paths="",hubs="",labels="";D.forEach((d,i)=>{let a=-90+i*step,[hx,hy]=polar(cx,cy,r,a),[lx,ly]=polar(cx,cy,outer,a);for(let j=0;j<6;j++){let aa=a-28+j*11,rad=r+(outer-r)*(.48+(j%3)*.14),p1=polar(hx,hy,(rad-r)*.32,aa+(j%2?7:-6)),p2=polar(hx,hy,(rad-r)*.66,aa-(j%2?7:-4)),end=polar(cx,cy,rad,aa);paths+=`<path class="line ${j<2?"active":"faint"}" d="M${hx} ${hy} L${p1[0]} ${p1[1]} L${p2[0]} ${p2[1]} L${end[0]} ${end[1]}"/>`;[p1,p2,end].forEach((p,k)=>{let n=document.createElement("button");n.className="node-dot "+(k===0?"progress":"locked");n.style.left=p[0]+"px";n.style.top=p[1]+"px";n.setAttribute("aria-label",d[0]+" branch");n.onclick=()=>enter(i);$("#overview").append(n)})}hubs+=`<button class="hub" data-i="${i}" style="left:${hx}px;top:${hy}px;--tone:${d[2]}" aria-label="Open ${d[0]}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><path d="M12 2v5M12 17v5M2 12h5M17 12h5"/></svg></button>`;labels+=`<div class="hub-label" style="left:${lx}px;top:${ly}px"><b>${d[0]}</b><small>${d[1]}</small></div>`});svg.setAttribute("viewBox",`0 0 ${w} ${h}`);svg.innerHTML=paths;$("#overview").insertAdjacentHTML("beforeend",hubs+labels);document.querySelectorAll("#overview .hub").forEach(b=>b.onclick=()=>enter(+b.dataset.i))}
function depthMap(ns){let m=new Map(),walk=n=>{if(m.has(n[0]))return m.get(n[0]);let d=n[2].length?Math.max(...n[2].map(p=>walk(ns.find(x=>x[0]===p))))+1:0;m.set(n[0],d);return d};ns.forEach(walk);return m}
function drawFocus(){document.querySelectorAll(".focus-node").forEach(e=>e.remove());let ns=nodes(),dm=depthMap(ns),max=Math.max(...dm.values()),byDepth=[...Array(max+1)].map(()=>[]);ns.forEach(n=>byDepth[dm.get(n[0])].push(n));let pos=new Map(),w=innerWidth,h=innerHeight,svg=$("#focusLines"),paths="";byDepth.forEach((arr,d)=>arr.forEach((n,i)=>{let x=w*(.08+(i+1)*.84/(arr.length+1)),y=h*(.71-d*.105);pos.set(n[0],[x,y])}));ns.forEach(n=>{let [x,y]=pos.get(n[0]);n[2].forEach(p=>{let q=pos.get(p);if(q)paths+=`<path class="line ${state(n)==="locked"?"faint":"active"}" d="M${q[0]} ${q[1]} Q${(q[0]+x)/2} ${(q[1]+y)/2} ${x} ${y}"/>`});let b=document.createElement("button");b.className="focus-node "+state(n);b.style.left=x+"px";b.style.top=y+"px";b.setAttribute("aria-label",n[1]);b.onclick=()=>selectNode(n);$("#focus").append(b)});svg.setAttribute("viewBox",`0 0 ${w} ${h}`);svg.innerHTML=paths;$("#focusHub").style.setProperty("--tone",D[current][2]);$("#focusHub").innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="12" cy="12" r="4"/><path d="M12 2v5M12 17v5M2 12h5M17 12h5"/></svg>'}
function enter(i){current=i;selected=null;$("#overview").classList.add("hidden");$("#focus").classList.add("active");$("#focusName").textContent=D[i][0];$("#focusDesc").textContent=D[i][1];drawFocus()}function selectNode(n){selected=n;let s=state(n);$("#veil").classList.add("on");$("#overlay").classList.add("show");$("#oState").textContent=s+" · "+n[0];$("#oName").textContent=n[1];let req=n[2].map(p=>nodes().find(x=>x[0]===p)?.[1]).filter(Boolean);$("#oDesc").textContent=req.length?"Prerequisites: "+req.join(" · "):"Foundation milestone · no prerequisites";$("#oProgress").textContent=s==="mastered"?"path illuminated · complete":s==="available"?"prerequisite met · ready":"prerequisite path still forming";let b=$("#unlock");b.hidden=s!=="available";b.disabled=progress.points<1;b.onclick=()=>{progress.lit[current+"-"+n[0]]=1;progress.points--;save();drawFocus();selectNode(n);toast("Node illuminated · path continues")}}function closeFocus(){$("#focus").classList.remove("active");$("#overview").classList.remove("hidden");$("#veil").classList.remove("on");$("#overlay").classList.remove("show");drawOverview()}function cycle(x){enter((current+x+D.length)%D.length)}function toast(t){let x=$("#toast");x.textContent=t;x.classList.add("show");setTimeout(()=>x.classList.remove("show"),1800)}
$("#focusBack").onclick=closeFocus;$("#overviewBtn").onclick=closeFocus;$("#focusPrev").onclick=()=>cycle(-1);$("#focusNext").onclick=()=>cycle(1);$("#overviewPrev").onclick=()=>cycle(-1);$("#overviewNext").onclick=()=>cycle(1);addEventListener("resize",()=>{drawOverview();if($("#focus").classList.contains("active"))drawFocus()});addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#focus").classList.contains("active"))closeFocus();if(e.key==="ArrowLeft")cycle(-1);if(e.key==="ArrowRight")cycle(1)});drawOverview();let q=new URLSearchParams(location.search).get("domain"),qi=D.findIndex(d=>d[0].toLowerCase().replaceAll(" ","-")===q);if(qi>=0)enter(qi);
