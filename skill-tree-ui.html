@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap');:root{--sky:#565e84;--ink:#f7f5fb;--fade:#c7c9d9;--line:#e7e4f28c;--cyan:#66e3e1;--violet:#b596ee;--pink:#e68eb4;--yellow:#f0d879;--red:#d77f8c;--sans:"DM Sans",sans-serif;--mono:"Space Mono",monospace}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--sky);color:var(--ink);font-family:var(--sans)}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:2px solid #fff;outline-offset:3px}.scene{position:relative;width:100vw;height:100dvh;min-height:480px;overflow:hidden;background:radial-gradient(ellipse at 50% 48%,#687199 0,#565e84 65%,#505779 100%)}.scene:before{content:"";position:absolute;inset:0;opacity:.22;background-image:radial-gradient(circle,#fff 0 1px,transparent 1.4px),radial-gradient(circle,#d7ddff 0 1px,transparent 1.5px);background-size:139px 167px,271px 223px;animation:stars 32s linear infinite}.map,.focus{position:absolute;inset:0;transition:opacity .55s,transform .75s}.map.hidden{opacity:0;pointer-events:none;transform:scale(.8)}.focus{opacity:0;pointer-events:none;transform:scale(.75)}.focus.active{opacity:1;pointer-events:auto;transform:scale(1)}svg.lines,.focus-lines{position:absolute;inset:0;width:100%;height:100%;overflow:visible}.line{fill:none;stroke:#f2efffa8;stroke-width:1.05;stroke-linecap:round;animation:draw 2s ease both}.line.active{stroke:#fff;filter:drop-shadow(0 0 3px #fff)}.line.faint{opacity:.5}.center{position:absolute;left:50%;top:50%;width:142px;height:142px;transform:translate(-50%,-50%);z-index:2;pointer-events:none}.center:before,.center:after{content:"";position:absolute;inset:27px;border-radius:50%;background:radial-gradient(circle,#fff 0 1px,transparent 2px);background-size:12px 11px;animation:spin 8s linear infinite}.center:after{inset:12px;opacity:.5;transform:rotate(30deg);background-size:18px 15px;animation-direction:reverse}.center i{position:absolute;left:50%;top:50%;width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 20px 7px #fff,0 0 40px 10px #e8b5df;transform:translate(-50%,-50%)}.hub{position:absolute;transform:translate(-50%,-50%);width:50px;height:50px;border-radius:50%;border:1px solid var(--tone);background:#596187dd;color:var(--tone);display:grid;place-items:center;z-index:5;box-shadow:0 0 0 7px color-mix(in srgb,var(--tone),transparent 82%),0 0 24px color-mix(in srgb,var(--tone),transparent 35%);transition:transform .25s,box-shadow .25s}.hub:hover{transform:translate(-50%,-50%) scale(1.15);box-shadow:0 0 0 11px color-mix(in srgb,var(--tone),transparent 80%),0 0 35px color-mix(in srgb,var(--tone),transparent 20%)}.hub svg{width:17px}.hub-label{position:absolute;transform:translate(-50%,-50%);z-index:5;min-width:160px;text-align:center;pointer-events:none}.hub-label b{display:block;font-size:12px;font-weight:500;letter-spacing:.25em;text-transform:uppercase;white-space:nowrap}.hub-label small{display:block;color:#c9ccdcbd;font:9px var(--mono);letter-spacing:.08em;margin-top:5px;white-space:nowrap}.node-dot,.focus-node{position:absolute;width:7px;height:7px;border:0;padding:0;border-radius:50%;background:#fbfaff;box-shadow:0 0 9px 2px #fff;z-index:4;transform:translate(-50%,-50%)}.node-dot.locked,.focus-node.locked{background:transparent;border:1px solid #e1dfed;box-shadow:none}.node-dot.progress,.focus-node.progress{background:var(--violet)}.node-dot:hover,.focus-node:hover{transform:translate(-50%,-50%) scale(1.8)}.control{position:absolute;bottom:14px;border:0;background:transparent;color:#f3f0faaa;font:10px var(--mono);letter-spacing:.17em;text-transform:uppercase;z-index:8;padding:8px}.control:hover{color:#fff}.control.centered{left:50%;transform:translateX(-50%)}.control.left{left:10px;font-size:27px}.control.right{right:10px;font-size:27px}.focus-hub{position:absolute;left:50%;top:72%;width:74px;height:74px;transform:translate(-50%,-50%);border-radius:50%;border:1px solid var(--tone);background:#596187e8;color:var(--tone);display:grid;place-items:center;z-index:4;box-shadow:0 0 0 9px color-mix(in srgb,var(--tone),transparent 80%),0 0 32px color-mix(in srgb,var(--tone),transparent 35%)}.focus-hub svg{width:25px}.focus-label{position:absolute;top:82%;left:50%;transform:translateX(-50%);text-align:center;white-space:nowrap}.focus-label b{display:block;font-size:16px;font-weight:500;letter-spacing:.3em;text-transform:uppercase}.focus-label small{display:block;margin-top:7px;color:#d0d1dfb8;font:9px var(--mono);letter-spacing:.1em}.veil{position:absolute;inset:0;background:#4b53774f;opacity:0;pointer-events:none;transition:opacity .3s}.veil.on{opacity:1}.overlay{position:absolute;right:7vw;bottom:18vh;width:min(290px,75vw);padding:5px 0 5px 15px;border-left:1px solid #fff8;opacity:0;transform:translateY(8px);transition:.3s;z-index:8;background:#565e847a}.overlay.show{opacity:1;transform:none}.overlay .state{color:#e9e7f7b8;font:9px var(--mono);letter-spacing:.13em;text-transform:uppercase}.overlay h2{margin:7px 0 4px;font-size:17px;font-weight:500}.overlay p{margin:0 0 9px;color:#d9d9e6;font-size:12px}.overlay .progress{color:#d8d9e7ad;font:9px var(--mono);margin-bottom:9px}.overlay button{border:1px solid #fff9;background:transparent;padding:7px 10px;font-size:10px}.overlay button:hover{background:#ffffff18}.toast{position:absolute;left:50%;bottom:70px;transform:translate(-50%,8px);background:#f5f3fb;color:#555d81;padding:9px 13px;font-size:11px;opacity:0;pointer-events:none;transition:.25s;z-index:15}.toast.show{opacity:1;transform:translate(-50%,0)}@keyframes stars{to{background-position:130px 95px,-100px 80px}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes draw{from{stroke-dashoffset:90;opacity:0}to{stroke-dashoffset:0;opacity:1}}@media(max-width:600px){.hub{width:44px;height:44px}.hub-label{min-width:90px}.hub-label b{font-size:9px;letter-spacing:.16em}.hub-label small{font-size:7px}.center{width:125px;height:125px}.focus-hub{top:75%;width:62px;height:62px}.focus-label{top:86%}.focus-label b{font-size:11px;letter-spacing:.2em}.overlay{right:6vw;bottom:16vh}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body><main class="scene" id="scene"><section class="map" id="overview" aria-label="Life OS capability constellation"><svg class="lines" id="overviewLines" aria-hidden="true"></svg><div class="center"><i></i></div><button class="control centered" id="overviewBtn">OVERVIEW · 08 DOMAINS</button><button class="control left" id="overviewPrev" aria-label="Previous domain">‹</button><button class="control right" id="overviewNext" aria-label="Next domain">›</button></section><section class="focus" id="focus" aria-label="Focused skill branch"><svg class="focus-lines" id="focusLines" aria-hidden="true"></svg><div class="focus-hub" id="focusHub"></div><div class="focus-label"><b id="focusName"></b><small id="focusDesc"></small></div><button class="control centered" id="focusBack">‹&nbsp; ALL DOMAINS</button><button class="control left" id="focusPrev" aria-label="Previous domain">‹</button><button class="control right" id="focusNext" aria-label="Next domain">›</button><div class="veil" id="veil"></div><aside class="overlay" id="overlay" aria-live="polite"><div class="state" id="oState"></div><h2 id="oName"></h2><p id="oDesc"></p><div class="progress" id="oProgress"></div><button id="unlock">LIGHT THIS NODE · 1 POINT</button></aside></section><div class="toast" id="toast" role="status"></div></main>
<script>
const KEY="life-os-constellation-demo-v3",domains=[["Life Path","direction / choices","#66e3e1"],["Handyman","tools / independence","#b596ee"],["Scholarly","depth / inquiry","#e68eb4"],["Financial","stewardship / leverage","#f0d879"],["Physical","strength / energy","#d77f8c"],["Social","trust / belonging","#66e3e1"],["Creative","ideas / making","#e68eb4"],["Inner Mastery","attention / meaning","#b596ee"]],names=["Name the north star","Clarify operating values","Design the current season","Run a monthly review","Build a long horizon","Choose a question","Read with a method","Build a knowledge system","Write a clear synthesis","Teach the idea","Build foundational strength","Protect recovery","Know your numbers","Build a cash buffer","Invest with a written thesis","Practice real listening","Tend the inner circle","Create a recurring table","Choose a medium","Make on a rhythm","Finish a body of work","Notice the mind","Train attention","Create a grounding ritual"];
let progress=JSON.parse(localStorage.getItem(KEY)||"null")||{points:1,lit:{"0-0":1,"1-0":1,"2-0":1,"3-0":1,"4-0":1,"5-0":1,"6-0":1,"7-0":1}},current=0,selected=0,$=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function save(){localStorage.setItem(KEY,JSON.stringify(progress))}
function state(d,n){let k=d+"-"+n;if(progress.lit[k])return"mastered";if(n===1||progress.lit[d+"-"+(n-1)])return"available";return n===0?"in-progress":"locked"}
function polar(cx,cy,r,a){let q=a*Math.PI/180;return[cx+Math.cos(q)*r,cy+Math.sin(q)*r]}
function drawOverview(){document.querySelectorAll("#overview .hub,#overview .hub-label,#overview .node-dot").forEach(e=>e.remove());let w=innerWidth,h=innerHeight,cx=w/2,cy=h*.5,r=Math.min(w,h)*.27,outer=Math.min(w,h)*.44,svg=$("#overviewLines"),paths="",hubs="",labels="";
 domains.forEach((d,i)=>{let a=-90+i*45,[hx,hy]=polar(cx,cy,r,a),[lx,ly]=polar(cx,cy,outer,a);for(let j=0;j<7;j++){let aa=a-34+j*11,rad=r+(outer-r)*(.55+(j%3)*.12),first=polar(hx,hy,(rad-r)*.35,aa+(j%2?5:-5)),mid=polar(hx,hy,(rad-r)*.7,aa-(j%2?7:-3)),end=polar(cx,cy,rad,aa);paths+=`<path class="line ${state(i,j%5)==="locked"?"faint":"active"}" d="M${hx} ${hy} L${first[0]} ${first[1]} L${mid[0]} ${mid[1]} L${end[0]} ${end[1]}"/>`;[first,mid,end].forEach((p,k)=>{let n=document.createElement("button");n.className="node-dot "+state(i,(j+k)%5);n.style.left=p[0]+"px";n.style.top=p[1]+"px";n.dataset.domain=i;n.setAttribute("aria-label",`${d[0]} · ${names[(i*3+j+k)%names.length]}`);n.onclick=()=>enter(i);$("#overview").append(n)});if(j===1||j===4){let fork=polar(cx,cy,rad+20,aa+(j===1?-8:8));paths+=`<path class="line" d="M${end[0]} ${end[1]} L${fork[0]} ${fork[1]}"/>`;let n=document.createElement("button");n.className="node-dot locked";n.style.left=fork[0]+"px";n.style.top=fork[1]+"px";n.dataset.domain=i;n.setAttribute("aria-label",`${d[0]} locked branch`);n.onclick=()=>enter(i);$("#overview").append(n)}}hubs+=`<button class="hub" data-i="${i}" style="left:${hx}px;top:${hy}px;--tone:${d[2]}" aria-label="Open ${d[0]}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><path d="M12 2v5M12 17v5M2 12h5M17 12h5"/></svg></button>`;labels+=`<div class="hub-label" style="left:${lx}px;top:${ly}px"><b>${d[0]}</b><small>${d[1]}</small></div>`});svg.setAttribute("viewBox",`0 0 ${w} ${h}`);svg.innerHTML=paths;$("#overview").insertAdjacentHTML("beforeend",hubs+labels);document.querySelectorAll(".hub").forEach(b=>b.onclick=()=>enter(+b.dataset.i))}
function enter(i){current=i;selected=0;$("#overview").classList.add("hidden");$("#focus").classList.add("active");$("#focusName").textContent=domains[i][0];$("#focusDesc").textContent=domains[i][1];$("#focusHub").style.setProperty("--tone",domains[i][2]);drawFocus()}
function drawFocus(){document.querySelectorAll(".focus-node").forEach(e=>e.remove());let w=innerWidth,h=innerHeight,hx=w/2,hy=h*.72,svg=$("#focusLines"),p="";for(let j=0;j<7;j++){let bx=w*(.12+j*.127),by=h*(.18+(j%3)*.05),mid=h*.5;p+=`<path class="line active" d="M${hx} ${hy} Q${(hx+bx)/2} ${mid} ${bx} ${by}"/>`;for(let k=0;k<3;k++){let x=bx+(k-1)*w*.065,y=by-(k+1)*h*.08+(j%2)*h*.03;p+=`<path class="line" d="M${bx} ${by} L${x} ${y}"/>`;let n=document.createElement("button");n.className="focus-node "+state(current,(j+k)%5);n.style.left=x+"px";n.style.top=y+"px";n.setAttribute("aria-label",names[(current*3+j+k)%names.length]);n.onclick=()=>selectNode((j+k)%5);$("#focus").append(n)}}svg.setAttribute("viewBox",`0 0 ${w} ${h}`);svg.innerHTML=p;$("#focusHub").innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="12" cy="12" r="4"/><path d="M12 2v5M12 17v5M2 12h5M17 12h5"/></svg>'}
function selectNode(n){selected=n;let s=state(current,n),name=names[(current*3+n)%names.length];$("#veil").classList.add("on");$("#overlay").classList.add("show");$("#oState").textContent=s+" · branch "+(n+1);$("#oName").textContent=name;$("#oDesc").textContent=["A deliberate practice that compounds.","A visible threshold for capability.","A small, serious promise to yourself."][n%3];$("#oProgress").textContent=s==="mastered"?"path illuminated · complete":s==="available"?"prerequisite met · ready":"prerequisite path still forming";let b=$("#unlock");b.hidden=s!=="available";b.disabled=progress.points<1;b.onclick=()=>{progress.lit[current+"-"+n]=1;progress.points--;save();drawFocus();selectNode(n);toast("Node illuminated · path continues")}}
function closeFocus(){ $("#focus").classList.remove("active");$("#overview").classList.remove("hidden");$("#veil").classList.remove("on");$("#overlay").classList.remove("show");drawOverview()}
function cycle(x){enter((current+x+8)%8)}function toast(t){let x=$("#toast");x.textContent=t;x.classList.add("show");setTimeout(()=>x.classList.remove("show"),1800)}
$("#focusBack").onclick=closeFocus;$("#overviewBtn").onclick=closeFocus;$("#focusPrev").onclick=()=>cycle(-1);$("#focusNext").onclick=()=>cycle(1);$("#overviewPrev").onclick=()=>cycle(-1);$("#overviewNext").onclick=()=>cycle(1);addEventListener("resize",()=>{drawOverview();if($("#focus").classList.contains("active"))drawFocus()});addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#focus").classList.contains("active"))closeFocus();if(e.key==="ArrowLeft")cycle(-1);if(e.key==="ArrowRight")cycle(1)});drawOverview();let q=new URLSearchParams(location.search).get("domain"),qi=domains.findIndex(d=>d[0].toLowerCase().replaceAll(" ","-")===q);if(qi>=0)enter(qi);
</script></body></html>
